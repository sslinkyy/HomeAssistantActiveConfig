mqtt:
  enabled: true
  host: core-mosquitto        # Mosquitto add-on hostname inside HA
  port: 1883
  # Copy secrets.yaml.example → secrets.yaml on the HA box (gitignored). Set the same values as
  # Frigate add-on env vars FRIGATE_MQTT_USER / FRIGATE_MQTT_PASSWORD. Never commit secrets.yaml.
  # Frigate config does not support HA !secret tags; use {FRIGATE_*} placeholders below.
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  topic_prefix: frigate
  client_id: frigate


go2rtc: {}
live: {}

cameras:
  eversecu1:
    enabled: true
    ffmpeg:
      inputs:
        # Same secrets.yaml + FRIGATE_RTSP_PASSWORD add-on env var (see MQTT comment above; no !secret here).
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:10554/tcp/av0_0
          roles: [detect, record]
          input_args: -rtsp_transport tcp
          # If this fails, swap to ONE of these (then Save & Restart):
          # - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:554/Streaming/Channels/101
          #   roles: [detect, record]
          #   input_args: -rtsp_transport tcp
          # - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:554/h264Preview_01_main
          #   roles: [detect, record]
          #   input_args: -rtsp_transport tcp
    detect:
      enabled: true
      fps: 5
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
    # Recordings use the HA Frigate add-on media mount: /media/frigate/recordings/eversecu1/
    record:
      enabled: true
      motion:
        days: 7
