mqtt:
  enabled: true
  host: core-mosquitto        # Mosquitto add-on hostname inside HA
  port: 1883
  # FRIGATE_MQTT_USER and FRIGATE_MQTT_PASSWORD: set only in the Frigate add-on env / HA secrets, never in git.
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  topic_prefix: frigate
  client_id: frigate


go2rtc: {}
live: {}

cameras:
  eversecu1:
    enabled: true
    ffmpeg:
      inputs:
        # FRIGATE_RTSP_PASSWORD: set only in the Frigate add-on env / HA secrets, never in git.
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:10554/tcp/av0_0
          roles: [detect, record]
          input_args: -rtsp_transport tcp
          # If this fails, swap to ONE of these (then Save & Restart):
          # - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:554/Streaming/Channels/101
          #   roles: [detect, record]
          #   input_args: -rtsp_transport tcp
          # - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:554/h264Preview_01_main
          #   roles: [detect, record]
          #   input_args: -rtsp_transport tcp
    detect:
      enabled: true
      fps: 5
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
    # Recordings use the HA Frigate add-on media mount: /media/frigate/recordings/eversecu1/
    record:
      enabled: true
      motion:
        days: 7
