mqtt:
  enabled: true
  host: core-mosquitto        # Mosquitto add-on hostname inside HA
  port: 1883
  # Copy secrets.yaml.example → secrets.yaml on the HA box (gitignored). Set the same values as
  # Frigate add-on env vars FRIGATE_MQTT_USER / FRIGATE_MQTT_PASSWORD. Never commit secrets.yaml.
  # Frigate config does not support HA !secret tags; use {FRIGATE_*} placeholders below.
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  topic_prefix: frigate
  client_id: frigate

go2rtc:
  streams:
    eversecu1:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:10554/tcp/av0_0
  # --- Two-way audio probe notes (COMMENTED / NOT ENABLED — do not claim talk works) ---
  # Eversecu eversecu1 facts (CEO):
  # - RTSP :10554 is video only for ingest; mic audio may ride on the stream. Speaker/talk is
  #   O-KAM proprietary LAN UDP, not RTSP. Do NOT use Hikvision isapi:// (wrong vendor).
  # - ONVIF may be http://192.168.1.171:10080/onvif/device_service — PTZ often works; talk often does not.
  # - Probe from the HA LAN only. Newer firmware can fail with "unexpected end of JSON input".
  # Future go2rtc talk probe (keep disabled until tested on LAN; set FRIGATE_DVRIP_PASSWORD in add-on env):
  #   streams:
  #     eversecu1_talk:
  #       - dvrip://admin:{FRIGATE_DVRIP_PASSWORD}@192.168.1.171:34567?backchannel=1
  # O-KAM LAN UDP talk path is vendor-specific and not configured here.

live:
  streams:
    eversecu1: eversecu1

cameras:
  eversecu1:
    enabled: true
    ffmpeg:
      inputs:
        # Restream via go2rtc (single RTSP session for detect+record). Source URL lives in go2rtc.streams above.
        - path: rtsp://127.0.0.1:8554/eversecu1
          roles: [detect, record]
          input_args: preset-rtsp-restream
          # If video fails, change go2rtc.streams.eversecu1 to ONE of these instead (not both paths):
          # - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:554/Streaming/Channels/101
          # - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.171:554/h264Preview_01_main
    objects:
      track:
        - person
        - car
    zones:
      driveway:
        # Tune coordinates in Frigate UI: Settings → Masks & Zones; not surveyed — placeholder only.
        coordinates: 0.15,0.55,0.85,0.55,1,1,0,1
        objects:
          - person
          - car
    detect:
      enabled: true
      fps: 5
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
    # Recordings use the HA Frigate add-on media mount: /media/frigate/recordings/eversecu1/
    record:
      enabled: true
      motion:
        days: 7
